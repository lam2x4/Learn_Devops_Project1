version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: TodoApp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "3663:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d TodoApp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./API-Learn-Devops/API-Learn-Devops
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=TodoApp;Username=postgres;Password=123
      DISABLE_HTTPS_REDIRECTION: "true"
    depends_on:
      - postgres
    ports:
      - "5000:8080"

volumes:
  pgdata: