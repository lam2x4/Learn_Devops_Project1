name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  # JOB 1: Build Image và đẩy lên Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./API-Learn-Devops/API-Learn-Devops/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/api-devops:latest

  # JOB 2: Chỉ ra lệnh cho EC2 kéo Image về chạy
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Đi tới thư mục chứa file docker-compose.yml trên EC2
            cd ~/Learn_Devops_Project1
            
            # 2. Login Docker (để pull image private nếu cần)
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            # 3. Pull image mới nhất về
            docker compose pull backend
            
            # 4. Restart hệ thống (chỉ update những gì thay đổi)
            docker compose up -d
            
            # 5. Dọn dẹp image cũ
            docker image prune -f