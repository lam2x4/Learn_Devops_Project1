name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  # JOB 1: Build Image và đẩy lên Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./API-Learn-Devops/API-Learn-Devops
          file: ./API-Learn-Devops/API-Learn-Devops/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/api-devops:latest

  # JOB 2: Chỉ ra lệnh cho EC2 kéo Image về chạy
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # BƯỚC MỚI: Đẩy file docker-compose.yml từ Git lên EC2
      - name: Copy docker-compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "~/Learn_Devops_Project1"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Đưa Secret vào môi trường của Action
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 👇 Cực kỳ quan trọng: Cho phép các biến này được sử dụng trong script bên dưới
          envs: DB_CONNECTION_STRING,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            cd ~/Learn_Devops_Project1
            
            # Login Docker Hub
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            
            # Kéo image mới về
            docker compose pull backend
            
            # Restart container. 
            # Lúc này Docker Compose sẽ tự khớp biến ${DB_CONNECTION_STRING} với giá trị ta truyền qua envs
            docker compose up -d
            
            # Dọn dẹp
            docker image prune -f