server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single Page App routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: reverse proxy to backend if desired
    # Uncomment to avoid CORS and use relative /api paths
